[build]
  # Kopiert den Server-Teil an den Ort, den Netlify erwartet, und baut dann die App.
  command = "mkdir -p netlify/functions && cp server.mjs netlify/functions/api.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
